<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-sky="clear-night">
  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="shell">
    <header class="top">
      <form id="search-form" class="search" role="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="city-input" type="search" placeholder="Search for a city" aria-label="City" autocomplete="off" />
        <button type="button" id="locate-btn" class="icon-btn" aria-label="Use my location" title="Use my location">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
        </button>
      </form>

      <div class="seg" role="group" aria-label="Temperature unit">
        <button type="button" data-unit="metric" aria-pressed="true">°C</button>
        <button type="button" data-unit="imperial" aria-pressed="false">°F</button>
      </div>
    </header>

    <div id="notice" class="notice" role="status" hidden></div>

    <section id="setup" class="panel setup" hidden>
      <h2>Connect OpenWeather</h2>
      <p>Paste your free API key to load live weather. It's saved only in this browser.</p>
      <form id="key-form">
        <input id="key-input" type="text" placeholder="API key" aria-label="OpenWeather API key" autocomplete="off" spellcheck="false" />
        <button class="btn" type="submit">Save key</button>
      </form>
      <p style="margin:16px 0 0"><a href="https://home.openweathermap.org/api_keys" target="_blank" rel="noopener">Get a free key</a></p>
    </section>

    <main id="dash" class="dash" hidden>
      <section class="hero" aria-labelledby="city-name">
        <h1 id="city-name" class="where"></h1>
        <p id="local-time" class="when"></p>
        <div class="temp-row">
          <span id="temp" class="temp"></span>
          <img id="icon" class="hero-icon" alt="" />
        </div>
        <p id="description" class="desc"></p>
        <p id="hilo" class="hilo"></p>
      </section>

      <section class="panel details" aria-label="Current conditions">
        <dl class="specs">
          <div><dt>Feels like</dt><dd id="feels"></dd></div>
          <div><dt>Humidity</dt><dd id="humidity"></dd></div>
          <div><dt>Wind</dt><dd id="wind"></dd></div>
          <div><dt>Pressure</dt><dd id="pressure"></dd></div>
          <div><dt>Visibility</dt><dd id="visibility"></dd></div>
          <div><dt>Cloud cover</dt><dd id="clouds"></dd></div>
        </dl>
      </section>

      <section class="panel rain" aria-labelledby="rain-headline">
        <h2 id="rain-headline" class="rain-headline"></h2>
        <p id="rain-detail" class="rain-detail"></p>
        <div id="chart" class="chart" role="img"></div>
      </section>

      <section class="panel week" aria-labelledby="week-title">
        <h2 id="week-title" class="panel-title">Next 5 days</h2>
        <ul id="days" class="days"></ul>
      </section>
    </main>
  </div>

  <script src="core.js"></script>
  <script src="script.js"></script>
</body>
</html>
