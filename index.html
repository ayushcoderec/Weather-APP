<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Weather</h1>

    <form id="search-form" class="search">
      <input id="city-input" type="text" placeholder="Search city..." autocomplete="off" required />
      <button type="submit">Search</button>
      <button type="button" id="locate-btn" title="Use my location">📍</button>
    </form>

    <div class="unit-toggle">
      <button id="unit-btn" type="button">Switch to °F</button>
    </div>

    <p id="status" class="status" hidden></p>

    <section id="current" class="card" hidden>
      <div class="current-top">
        <div>
          <h2 id="city-name"></h2>
          <p id="description" class="muted"></p>
        </div>
        <img id="icon" alt="weather icon" />
      </div>
      <div id="temp" class="temp"></div>
      <div class="details">
        <div><span class="muted">Feels like</span><strong id="feels"></strong></div>
        <div><span class="muted">Humidity</span><strong id="humidity"></strong></div>
        <div><span class="muted">Wind</span><strong id="wind"></strong></div>
        <div><span class="muted">Pressure</span><strong id="pressure"></strong></div>
      </div>
    </section>

    <section id="forecast-wrap" hidden>
      <h3>5-day forecast</h3>
      <div id="forecast" class="forecast"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
