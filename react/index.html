<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet" />
  <style>
/* The sky colours are registered as real colour properties so the background can fade between conditions. */
@property --sky-a { syntax: "<color>"; inherits: true; initial-value: #0a1124; }
@property --sky-b { syntax: "<color>"; inherits: true; initial-value: #1b2a55; }
@property --sky-c { syntax: "<color>"; inherits: true; initial-value: #3a3566; }

:root {
  --ink: #f6f8fc;
  --ink-soft: rgba(246, 248, 252, 0.78);
  --ink-faint: rgba(246, 248, 252, 0.55);
  --glass: rgba(9, 16, 34, 0.32);
  --glass-edge: rgba(255, 255, 255, 0.14);
  --line: rgba(255, 255, 255, 0.12);
  --rain: #8fdcff;
  --radius-lg: 28px;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}

/* ---------- sky themes (set from JS via body[data-sky]) ---------- */
body[data-sky="clear-day"]    { --sky-a: #1a4aa8; --sky-b: #3578cf; --sky-c: #e8a56e; }
body[data-sky="clear-night"]  { --sky-a: #060a1c; --sky-b: #172457; --sky-c: #3b2f6e; }
body[data-sky="clouds-day"]   { --sky-a: #40506a; --sky-b: #70839d; --sky-c: #aab5c2; }
body[data-sky="clouds-night"] { --sky-a: #0f1522; --sky-b: #232d3f; --sky-c: #3a4558; }
body[data-sky="rain-day"]     { --sky-a: #1b3050; --sky-b: #38567a; --sky-c: #6685a4; }
body[data-sky="rain-night"]   { --sky-a: #0a1120; --sky-b: #17263d; --sky-c: #2b4260; }
body[data-sky^="storm"]       { --sky-a: #0f0e1a; --sky-b: #272241; --sky-c: #4a3f6b; }
body[data-sky="snow-day"]     { --sky-a: #566d8c; --sky-b: #8aa0ba; --sky-c: #d0dbe8; }
body[data-sky="snow-night"]   { --sky-a: #131c2e; --sky-b: #2c3c57; --sky-c: #566b8a; }
body[data-sky="mist-day"]     { --sky-a: #4a5359; --sky-b: #7b858c; --sky-c: #b0b6ba; }
body[data-sky="mist-night"]   { --sky-a: #12171b; --sky-b: #2a3238; --sky-c: #454f57; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--body);
  font-size: 1rem;
  line-height: 1.5;
  color: var(--ink);
  transition: --sky-a 1.4s ease, --sky-b 1.4s ease, --sky-c 1.4s ease;
  -webkit-font-smoothing: antialiased;
}

/* The sky is a fixed layer behind the page. This is more reliable on phones than background-attachment: fixed. */
html { background: #0a1124; }
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: linear-gradient(175deg, var(--sky-a) 0%, var(--sky-b) 55%, var(--sky-c) 130%);
}

#fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

.shell {
  position: relative;
  z-index: 1;
  max-width: 1180px;
  margin: 0 auto;
  padding: clamp(16px, 3vw, 40px);
}

:where(button, input, a):focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

/* ---------- top bar ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }

.search {
  flex: 1 1 320px;
  max-width: 520px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 5px 5px 18px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
}
.search:focus-within { outline: 2px solid #fff; outline-offset: 2px; }
.search svg { flex: none; opacity: 0.7; }
.search input {
  flex: 1;
  min-width: 0;
  padding: 10px 0;
  border: 0;
  outline: none;
  background: none;
  color: inherit;
  font: inherit;
}
.search input::placeholder { color: var(--ink-faint); }

.icon-btn {
  flex: none;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.14);
  color: inherit;
  cursor: pointer;
  transition: background 0.2s;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.26); }

.seg {
  display: inline-flex;
  padding: 4px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
}
.seg button {
  min-width: 3.2rem;
  padding: 8px 16px;
  border: 0;
  border-radius: 999px;
  background: none;
  color: var(--ink-soft);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.seg button[aria-pressed="true"] { background: #fff; color: #0c1426; }

/* ---------- notices + setup ---------- */
.notice {
  margin-top: 16px;
  padding: 14px 20px;
  border-radius: 18px;
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
}
.notice.is-error { border-color: rgba(255, 140, 140, 0.55); background: rgba(90, 20, 30, 0.42); }

.panel {
  border-radius: var(--radius-lg);
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  backdrop-filter: blur(18px) saturate(1.2);
  padding: clamp(20px, 2.5vw, 32px);
}
.panel-title { margin: 0 0 8px; font-family: var(--display); font-size: 1.15rem; font-weight: 600; }

.setup { max-width: 560px; margin: clamp(24px, 6vw, 72px) auto 0; }
.setup h2 { margin: 0 0 6px; font-family: var(--display); font-size: 1.6rem; font-weight: 600; }
.setup p { margin: 0 0 18px; color: var(--ink-soft); }
.setup form { display: flex; gap: 8px; flex-wrap: wrap; }
.setup input {
  flex: 1 1 240px;
  min-width: 0;
  padding: 12px 16px;
  border-radius: 14px;
  border: 1px solid var(--glass-edge);
  background: rgba(0, 0, 0, 0.25);
  color: inherit;
  font: inherit;
}
.btn {
  padding: 12px 22px;
  border: 0;
  border-radius: 999px;
  background: #fff;
  color: #0c1426;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover { background: #e7eefc; }
.setup a { color: var(--rain); }

/* ---------- dashboard layout ---------- */
.dash {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
  margin-top: clamp(20px, 4vw, 44px);
  transition: opacity 0.3s;
}
.dash[aria-busy="true"] { opacity: 0.55; }
.hero    { grid-column: 1 / 8; }
.details { grid-column: 8 / 13; }
.rain    { grid-column: 1 / 9; }
.week    { grid-column: 9 / 13; }
@media (max-width: 960px) {
  .hero, .details, .rain, .week { grid-column: 1 / -1; }
}

/* ---------- hero: sits directly on the sky, no card ---------- */
.hero {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(8px, 2vw, 24px) 0;
  text-shadow: 0 1px 28px rgba(0, 0, 0, 0.2);
}
.where { margin: 0; font-family: var(--display); font-size: clamp(1.4rem, 2.6vw, 2rem); font-weight: 600; letter-spacing: -0.01em; }
.when { margin: 2px 0 0; color: var(--ink-soft); }
.temp-row { display: flex; align-items: center; gap: clamp(8px, 2vw, 24px); margin-top: clamp(12px, 3vw, 32px); }
.temp {
  font-family: var(--display);
  font-size: clamp(6.5rem, 18vw, 12.5rem);
  font-weight: 250;
  line-height: 0.82;
  letter-spacing: -0.05em;
  font-variant-numeric: tabular-nums;
}
.hero-icon { width: clamp(88px, 12vw, 148px); height: auto; filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.25)); }
.desc { margin: clamp(8px, 2vw, 18px) 0 0; font-family: var(--display); font-size: clamp(1.3rem, 2.4vw, 1.8rem); font-weight: 500; text-transform: capitalize; }
.hilo { margin: 4px 0 0; color: var(--ink-soft); }

/* ---------- details: one panel, hairline dividers ---------- */
.details { padding: 0; overflow: hidden; align-self: center; }
.specs { display: grid; grid-template-columns: 1fr 1fr; margin: 0; }
.specs > div { padding: 18px 22px; }
.specs > div:nth-child(n + 3) { border-top: 1px solid var(--line); }
.specs > div:nth-child(even) { border-left: 1px solid var(--line); }
.specs dt { color: var(--ink-soft); font-size: 0.9rem; }
.specs dd { margin: 2px 0 0; font-family: var(--display); font-size: 1.6rem; font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---------- rain outlook: the focal point ---------- */
.rain-headline {
  margin: 0;
  max-width: 22ch;
  font-family: var(--display);
  font-size: clamp(1.7rem, 3.2vw, 2.5rem);
  font-weight: 500;
  line-height: 1.1;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.rain-detail { margin: 10px 0 0; color: var(--ink-soft); max-width: 52ch; }

.chart { margin-top: 26px; overflow-x: auto; padding-bottom: 4px; }
.chart-inner { min-width: 560px; }
.pops, .slots { display: flex; }
.pops > *, .slots > * { flex: 1 1 0; text-align: center; }
.pop { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.pop.zero { opacity: 0.5; font-weight: 500; }
.pop.is-peak { color: var(--rain); font-size: 1.1rem; }

.curve { display: block; width: 100%; height: 110px; margin: 4px 0; animation: sweep 1.2s cubic-bezier(0.3, 0.7, 0.2, 1) both; }
.curve .area { fill: url(#rainFill); }
.curve .line { fill: none; stroke: var(--rain); stroke-width: 2.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
@keyframes sweep { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

.slot { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 8px; border-top: 1px solid var(--line); }
.slot .t { color: var(--ink-soft); font-size: 0.9rem; }
.slot .c { font-weight: 600; font-variant-numeric: tabular-nums; }
.slot .mm { min-height: 1.4em; color: var(--rain); font-size: 0.82rem; font-variant-numeric: tabular-nums; }

/* ---------- 5-day list ---------- */
.days { list-style: none; margin: 8px 0 0; padding: 0; }
.days li {
  display: grid;
  grid-template-columns: 3.2rem 36px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid var(--line);
}
.days li:first-child { border-top: 0; }
.dn { font-weight: 600; }
.chance { display: flex; align-items: center; gap: 8px; }
.chance .bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
.chance .bar i { display: block; height: 100%; border-radius: 3px; background: var(--rain); }
.chance b { min-width: 2.6rem; text-align: right; font-size: 0.9rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.range { display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
.range .lo { color: var(--ink-faint); }
.range .hi { font-weight: 600; }

@media (max-width: 600px) {
  .specs > div { padding: 14px 16px; }
  .specs dd { font-size: 1.35rem; }

  /* Fit all eight time slots on a phone instead of scrolling sideways. */
  .chart-inner { min-width: 0; }
  .pop { font-size: 0.78rem; }
  .pop.is-peak { font-size: 0.85rem; }
  .slot .t { font-size: 0.72rem; }
  .slot .c { font-size: 0.85rem; }
  .slot .mm { font-size: 0.66rem; }
  .slot img { width: 28px; height: 28px; }
}

@media (prefers-reduced-motion: reduce) {
  body, .dash, .curve { transition: none; animation: none; }
}

  </style>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>
</head>
<body data-sky="clear-night">
  <div id="root"></div>

  <script>
/* Shared weather logic: API calls, rain prediction, formatting, rain/snow animation.
   Loaded as a normal <script>, exposes window.WeatherCore. Used by both the vanilla and React versions. */
(function (global) {
  "use strict";

  const BASE = "https://api.openweathermap.org/data/2.5";
  const WET = ["Rain", "Drizzle", "Thunderstorm", "Snow"];

  /* ---------- small helpers ---------- */
  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const iconUrl = (code, size = "@2x") => `https://openweathermap.org/img/wn/${code}${size}.png`;
  const pct = (p) => Math.round(p * 100);
  const compass = (deg) => ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(deg / 45) % 8];

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
  };

  /* ---------- city-local time ----------
     OpenWeather gives UTC timestamps plus the city's UTC offset in seconds.
     Shifting by the offset and reading the UTC fields gives the city's local clock. */
  const shifted = (dt, tz) => new Date((dt + tz) * 1000);
  const fmtHour = (dt, tz) => shifted(dt, tz).toLocaleTimeString("en-US", { hour: "numeric", timeZone: "UTC" });
  const fmtClock = (dt, tz) => {
    const d = shifted(dt, tz);
    return (
      d.toLocaleDateString("en-US", { weekday: "long", timeZone: "UTC" }) + ", " +
      d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "UTC" })
    );
  };

  /* ---------- network ---------- */
  async function getJSON(url) {
    let res;
    try {
      res = await fetch(url);
    } catch (e) {
      const err = new Error("network");
      err.network = true;
      throw err;
    }
    let data = {};
    try { data = await res.json(); } catch (e) { /* non-JSON body */ }
    if (!res.ok) {
      const err = new Error(data.message || `Request failed (${res.status})`);
      err.status = res.status;
      throw err;
    }
    return data;
  }

  async function fetchWeather(query, units, key) {
    const loc = query.type === "city" ? `q=${encodeURIComponent(query.city)}` : `lat=${query.lat}&lon=${query.lon}`;
    const tail = `&units=${units}&appid=${encodeURIComponent(key)}`;
    const [current, forecast] = await Promise.all([
      getJSON(`${BASE}/weather?${loc}${tail}`),
      getJSON(`${BASE}/forecast?${loc}${tail}`),
    ]);
    return { current, forecast };
  }

  function friendlyError(err) {
    if (err.network) return "Couldn't reach OpenWeather. Check your internet connection and try again.";
    if (err.status === 401) return "OpenWeather rejected this API key. Check it for typos, or wait a little: new keys can take up to two hours to activate.";
    if (err.status === 404) return "No city matches that search. Check the spelling or try a larger nearby city.";
    if (err.status === 429) return "This API key has made too many requests. Wait a minute and try again.";
    return err.message || "Something went wrong while loading the weather.";
  }

  /* ---------- sky theme + precipitation effect ---------- */
  function skyFor(w) {
    const id = w.id;
    const when = w.icon.endsWith("n") ? "night" : "day";
    let kind;
    if (id >= 200 && id < 300) kind = "storm";
    else if (id < 600) kind = "rain";
    else if (id < 700) kind = "snow";
    else if (id < 800) kind = "mist";
    else if (id <= 801) kind = "clear";
    else kind = "clouds";
    return `${kind}-${when}`;
  }

  function precipFor(w) {
    const id = w.id;
    if (id >= 200 && id < 300) return { mode: "rain", intensity: 1.7 };
    if (id >= 300 && id < 400) return { mode: "rain", intensity: 0.45 };
    if (id >= 500 && id < 600) {
      const i = id === 500 ? 0.6 : id === 501 ? 1 : id <= 504 ? 1.5 : id === 511 ? 0.9 : id === 520 ? 0.7 : id === 521 ? 1 : 1.4;
      return { mode: "rain", intensity: i };
    }
    if (id >= 600 && id < 700) return { mode: "snow", intensity: id <= 601 ? 0.7 : 1.2 };
    return { mode: "none", intensity: 0 };
  }

  /* ---------- rain prediction ----------
     The forecast endpoint returns 3-hour steps. Each has `pop` (probability of precipitation, 0 to 1)
     and, when wet, `rain["3h"]` / `snow["3h"]` in mm. We look at the next 8 steps (24 hours). */
  function rainOutlook(current, list, tz) {
    const slots = list.slice(0, 8).map((i) => ({
      dt: i.dt,
      pop: i.pop || 0,
      mm: ((i.rain && i.rain["3h"]) || 0) + ((i.snow && i.snow["3h"]) || 0),
      temp: i.main.temp,
      icon: i.weather[0].icon,
      main: i.weather[0].main,
    }));

    const w = current.weather[0];
    const nowWet = WET.includes(w.main);
    const total = slots.reduce((sum, s) => sum + s.mm, 0);
    const maxPop = Math.max(...slots.map((s) => s.pop));
    const peakIndex = maxPop >= 0.3 ? slots.findIndex((s) => s.pop === maxPop) : -1;
    const hourOf = (i) => fmtHour(slots[i].dt, tz);

    let headline;
    if (nowWet) {
      const noun = w.main === "Snow" ? "Snow" : "Rain";
      const end = slots.findIndex((s) => s.pop < 0.3);
      if (end === -1) headline = `${noun} continues through the next 24 hours`;
      else if (end === 0) headline = `${noun} should ease within 3 hours`;
      else headline = `${noun} easing around ${hourOf(end)}`;
    } else {
      const likely = slots.findIndex((s) => s.pop >= 0.5);
      const maybe = slots.findIndex((s) => s.pop >= 0.3);
      if (likely === 0) headline = `${slots[0].main === "Snow" ? "Snow" : "Rain"} likely within 3 hours`;
      else if (likely > 0) headline = `${slots[likely].main === "Snow" ? "Snow" : "Rain"} likely around ${hourOf(likely)}`;
      else if (maybe === 0) headline = "Chance of showers within 3 hours";
      else if (maybe > 0) headline = `Chance of ${slots[maybe].main === "Snow" ? "snow" : "showers"} around ${hourOf(maybe)}`;
      else headline = "No rain expected in the next 24 hours";
    }

    let detail;
    if (total < 0.1 && maxPop < 0.3 && !nowWet) {
      detail = `The highest chance is ${pct(maxPop)}%. No umbrella needed.`;
    } else {
      detail = total >= 0.1
        ? `About ${total.toFixed(1)} mm expected over the next 24 hours.`
        : "Little to no accumulation expected over the next 24 hours.";
      if (maxPop >= 0.5) detail += " Take an umbrella.";
      else if (maxPop >= 0.3) detail += " An umbrella is worth packing.";
    }

    return { headline, detail, slots, total, maxPop, peakIndex };
  }

  /* Group the 3-hour steps into one row per local calendar day. */
  function dailySummary(list, tz, nowDt) {
    const dayKey = (dt) => shifted(dt, tz).toISOString().slice(0, 10);
    const todayKey = dayKey(nowDt);
    const groups = new Map();
    list.forEach((item) => {
      const k = dayKey(item.dt);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(item);
    });

    // Late in the evening "today" has only one or two steps left, which makes a poor row. Skip it.
    let entries = [...groups.entries()];
    if (entries.length && entries[0][1].length < 3) entries = entries.slice(1);

    return entries.slice(0, 5).map(([key, items]) => {
      const noon = items.reduce((best, it) => {
        const dist = (x) => Math.abs(shifted(x.dt, tz).getUTCHours() - 12);
        return dist(it) < dist(best) ? it : best;
      });
      return {
        key,
        label: key === todayKey ? "Today" : shifted(noon.dt, tz).toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" }),
        icon: noon.weather[0].icon.replace("n", "d"),
        hi: Math.max(...items.map((i) => i.main.temp_max)),
        lo: Math.min(...items.map((i) => i.main.temp_min)),
        pop: Math.max(...items.map((i) => i.pop || 0)),
      };
    });
  }

  /* Highest and lowest temperature over the next 24 hours, including right now. */
  function range24(current, list) {
    const temps = list.slice(0, 8).flatMap((i) => [i.main.temp_max, i.main.temp_min]);
    temps.push(current.main.temp);
    return { hi: Math.max(...temps), lo: Math.min(...temps) };
  }

  /* Smooth SVG path through the rain-chance values. One point per 100 units of width,
     centred in its column, so the curve lines up with the HTML columns above and below it. */
  function curve(pops) {
    const n = pops.length, W = n * 100, top = 8, base = 96;
    const r = (v) => +v.toFixed(1);
    const pts = pops.map((p, i) => [i * 100 + 50, base - (base - top) * Math.min(1, p)]);
    let d = `M0 ${r(pts[0][1])} L${pts[0][0]} ${r(pts[0][1])}`;
    for (let i = 1; i < n; i++) {
      const [ax, ay] = pts[i - 1], [bx, by] = pts[i], mx = (ax + bx) / 2;
      d += ` C${mx} ${r(ay)} ${mx} ${r(by)} ${bx} ${r(by)}`;
    }
    d += ` L${W} ${r(pts[n - 1][1])}`;
    return { W, line: d, area: `${d} L${W} 100 L0 100 Z` };
  }

  /* ---------- falling rain / snow on a full-screen canvas ---------- */
  function createFX(canvas) {
    const ctx = canvas.getContext("2d");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    let w = 0, h = 0, parts = [], mode = "none", intensity = 0, raf = 0, last = 0;
    const rand = (a, b) => a + Math.random() * (b - a);

    function spawn(anywhere) {
      const x = rand(-60, w + 60);
      const y = anywhere ? rand(0, h) : rand(-60, 0);
      return mode === "rain"
        ? { x, y, len: rand(10, 24), v: rand(900, 1400), a: rand(0.15, 0.4) }
        : { x, y, r: rand(1, 3), v: rand(30, 80), ph: rand(0, 6.28), a: rand(0.4, 0.9) };
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const density = mode === "rain" ? 7000 : 12000;
      const count = mode === "none" ? 0 : Math.round(Math.min(260, (w * h) / density) * intensity);
      parts = Array.from({ length: count }, () => spawn(true));
    }

    function frame(t) {
      const dt = Math.min(0.05, (t - last) / 1000);
      last = t;
      ctx.clearRect(0, 0, w, h);
      if (mode === "rain") {
        ctx.lineWidth = 1.2;
        ctx.lineCap = "round";
        for (const p of parts) {
          ctx.strokeStyle = `rgba(200,225,255,${p.a})`;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.len * 0.18, p.y - p.len);
          ctx.stroke();
          p.y += p.v * dt;
          p.x -= p.v * dt * 0.18;
          if (p.y - p.len > h) Object.assign(p, spawn(false));
        }
      } else {
        for (const p of parts) {
          ctx.fillStyle = `rgba(255,255,255,${p.a})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, 6.283);
          ctx.fill();
          p.y += p.v * dt;
          p.x += Math.sin(t / 1000 + p.ph) * 20 * dt;
          if (p.y - p.r > h) Object.assign(p, spawn(false));
        }
      }
      raf = requestAnimationFrame(frame);
    }

    let resizeTimer = 0;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 150);
    });

    return {
      set(nextMode, nextIntensity) {
        mode = nextMode;
        intensity = nextIntensity;
        cancelAnimationFrame(raf);
        resize();
        ctx.clearRect(0, 0, w, h);
        if (mode === "none" || reduce.matches) return;
        last = performance.now();
        raf = requestAnimationFrame(frame);
      },
    };
  }

  global.WeatherCore = {
    esc, iconUrl, pct, compass, store,
    fmtHour, fmtClock, fetchWeather, friendlyError,
    skyFor, precipFor, rainOutlook, dailySummary, range24, curve, createFX,
  };
})(window);

  </script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { iconUrl, pct, compass, store, fmtHour, fmtClock, fetchWeather, friendlyError,
            skyFor, precipFor, rainOutlook, dailySummary, range24, curve, createFX } = WeatherCore;

    // Optional: paste your OpenWeather key here. If you leave it empty, the app asks for it on first load
    // and remembers it in this browser. Get a free key at https://home.openweathermap.org/api_keys
    const API_KEY = "cc43ba69009c31161202dfcc15594f47";
    const DEFAULT_QUERY = { type: "city", city: "Raipur" };

    function SearchBar({ onSearch, onLocate }) {
      const [value, setValue] = useState("");
      const submit = (e) => {
        e.preventDefault();
        if (value.trim()) onSearch(value.trim());
      };
      return (
        <form className="search" role="search" onSubmit={submit}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input type="search" placeholder="Search for a city" aria-label="City" autoComplete="off"
                 value={value} onChange={(e) => setValue(e.target.value)} />
          <button type="button" className="icon-btn" onClick={onLocate} aria-label="Use my location" title="Use my location">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3" /><circle cx="12" cy="12" r="8" /><path d="M12 1v3M12 20v3M1 12h3M20 12h3" /></svg>
          </button>
        </form>
      );
    }

    function UnitToggle({ units, onChange }) {
      return (
        <div className="seg" role="group" aria-label="Temperature unit">
          {[["metric", "°C"], ["imperial", "°F"]].map(([u, label]) => (
            <button key={u} type="button" aria-pressed={units === u} onClick={() => onChange(u)}>{label}</button>
          ))}
        </div>
      );
    }

    function Setup({ onSave }) {
      const [key, setKey] = useState("");
      const submit = (e) => {
        e.preventDefault();
        if (key.trim()) onSave(key.trim());
      };
      return (
        <section className="panel setup">
          <h2>Connect OpenWeather</h2>
          <p>Paste your free API key to load live weather. It's saved only in this browser.</p>
          <form onSubmit={submit}>
            <input type="text" placeholder="API key" aria-label="OpenWeather API key" autoComplete="off" spellCheck="false"
                   value={key} onChange={(e) => setKey(e.target.value)} />
            <button className="btn" type="submit">Save key</button>
          </form>
          <p style={{ margin: "16px 0 0" }}>
            <a href="https://home.openweathermap.org/api_keys" target="_blank" rel="noopener noreferrer">Get a free key</a>
          </p>
        </section>
      );
    }

    function Hero({ current, list, tz }) {
      const w = current.weather[0];
      const place = current.sys && current.sys.country ? `${current.name}, ${current.sys.country}` : current.name;
      const { hi, lo } = range24(current, list);
      return (
        <section className="hero" aria-labelledby="city-name">
          <h1 id="city-name" className="where">{place}</h1>
          <p className="when">{fmtClock(current.dt, tz)}</p>
          <div className="temp-row">
            <span className="temp">{Math.round(current.main.temp)}°</span>
            <img className="hero-icon" src={iconUrl(w.icon, "@4x")} alt="" />
          </div>
          <p className="desc">{w.description}</p>
          <p className="hilo">High {Math.round(hi)}°, low {Math.round(lo)}° over the next 24 hours</p>
        </section>
      );
    }

    function Details({ current, metric }) {
      const wind = metric ? current.wind.speed * 3.6 : current.wind.speed;
      const dir = current.wind.deg != null ? ` ${compass(current.wind.deg)}` : "";
      const rows = [
        ["Feels like", `${Math.round(current.main.feels_like)}°`],
        ["Humidity", `${current.main.humidity}%`],
        ["Wind", `${Math.round(wind)} ${metric ? "km/h" : "mph"}${dir}`],
        ["Pressure", `${current.main.pressure} hPa`],
        ["Visibility", current.visibility != null ? `${+(current.visibility / 1000).toFixed(1)} km` : "n/a"],
        ["Cloud cover", `${current.clouds ? current.clouds.all : 0}%`],
      ];
      return (
        <section className="panel details" aria-label="Current conditions">
          <dl className="specs">
            {rows.map(([label, value]) => (
              <div key={label}><dt>{label}</dt><dd>{value}</dd></div>
            ))}
          </dl>
        </section>
      );
    }

    function RainOutlook({ outlook, tz }) {
      const { slots } = outlook;
      const c = curve(slots.map((s) => s.pop));
      return (
        <section className="panel rain" aria-labelledby="rain-headline">
          <h2 id="rain-headline" className="rain-headline">{outlook.headline}</h2>
          <p className="rain-detail">{outlook.detail}</p>
          <div className="chart" role="img" aria-label={`${outlook.headline}. ${outlook.detail}`}>
            <div className="chart-inner">
              <div className="pops">
                {slots.map((s, i) => {
                  const cls = i === outlook.peakIndex ? " is-peak" : s.pop < 0.05 ? " zero" : "";
                  return <span key={s.dt} className={"pop" + cls}>{pct(s.pop)}%</span>;
                })}
              </div>
              {/* keyed on the path so the sweep animation replays whenever the data changes */}
              <svg key={c.line} className="curve" viewBox={`0 0 ${c.W} 100`} preserveAspectRatio="none" aria-hidden="true">
                <defs>
                  <linearGradient id="rainFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stopColor="#8fdcff" stopOpacity="0.55" />
                    <stop offset="1" stopColor="#8fdcff" stopOpacity="0" />
                  </linearGradient>
                </defs>
                <path className="area" d={c.area} />
                <path className="line" d={c.line} />
              </svg>
              <div className="slots">
                {slots.map((s) => (
                  <div className="slot" key={s.dt}>
                    <span className="t">{fmtHour(s.dt, tz)}</span>
                    <img src={iconUrl(s.icon)} alt="" width="36" height="36" />
                    <span className="c">{Math.round(s.temp)}°</span>
                    <span className="mm">{s.mm >= 0.1 ? s.mm.toFixed(1) + " mm" : ""}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Week({ days }) {
      return (
        <section className="panel week" aria-labelledby="week-title">
          <h2 id="week-title" className="panel-title">Next 5 days</h2>
          <ul className="days">
            {days.map((d) => {
              const chance = pct(d.pop);
              return (
                <li key={d.key}>
                  <span className="dn">{d.label}</span>
                  <img src={iconUrl(d.icon)} alt="" width="36" height="36" />
                  <span className="chance" aria-label={`${chance}% chance of rain`}>
                    <span className="bar"><i style={{ width: chance + "%" }} /></span><b>{chance}%</b>
                  </span>
                  <span className="range"><span className="hi">{Math.round(d.hi)}°</span><span className="lo">{Math.round(d.lo)}°</span></span>
                </li>
              );
            })}
          </ul>
        </section>
      );
    }

    function Dashboard({ data, units, loading }) {
      const { current, forecast } = data;
      const tz = current.timezone;
      const days = dailySummary(forecast.list, tz, current.dt);
      const outlook = rainOutlook(current, forecast.list, tz);
      return (
        <main className="dash" aria-busy={loading}>
          <Hero current={current} list={forecast.list} tz={tz} />
          <Details current={current} metric={units === "metric"} />
          <RainOutlook outlook={outlook} tz={tz} />
          <Week days={days} />
        </main>
      );
    }

    function App() {
      const [units, setUnits] = useState(() => (store.get("units") === "imperial" ? "imperial" : "metric"));
      const [query, setQuery] = useState(() => {
        try { return JSON.parse(store.get("query")) || DEFAULT_QUERY; } catch (e) { return DEFAULT_QUERY; }
      });
      const [apiKey, setApiKey] = useState(() => API_KEY || store.get("owm_key") || "");
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [notice, setNotice] = useState(null);
      const canvasRef = useRef(null);
      const fxRef = useRef(null);

      useEffect(() => { fxRef.current = createFX(canvasRef.current); }, []);

      // Fetch whenever the place, the unit or the key changes.
      useEffect(() => {
        if (!apiKey) {
          setData(null);
          fxRef.current.set("none", 0);
          return;
        }
        let cancelled = false;
        setLoading(true);
        setNotice(null);
        fetchWeather(query, units, apiKey)
          .then((d) => {
            if (cancelled) return;
            setData(d);
            store.set("query", JSON.stringify(query));
          })
          .catch((err) => {
            if (cancelled) return;
            setNotice({ text: friendlyError(err), error: true });
            if (err.status === 401) setApiKey(""); // show the key form again
          })
          .finally(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; };
      }, [query, units, apiKey]);

      // Re-theme the sky and the rain/snow effect when new data arrives.
      useEffect(() => {
        if (!data) return;
        const w = data.current.weather[0];
        document.body.dataset.sky = skyFor(w);
        const p = precipFor(w);
        fxRef.current.set(p.mode, p.intensity);
        document.title = `${Math.round(data.current.main.temp)}° in ${data.current.name}`;
      }, [data]);

      const changeUnits = (u) => { setUnits(u); store.set("units", u); };

      const locate = () => {
        if (!navigator.geolocation) {
          return setNotice({ text: "This browser can't share your location. Search for a city instead.", error: true });
        }
        setNotice({ text: "Finding your location…" });
        navigator.geolocation.getCurrentPosition(
          (pos) => setQuery({ type: "coords", lat: pos.coords.latitude, lon: pos.coords.longitude }),
          () => setNotice({ text: "Location access is blocked. Allow it in your browser settings, or search for a city.", error: true })
        );
      };

      const saveKey = (key) => { store.set("owm_key", key); setApiKey(key); };

      return (
        <>
          <canvas id="fx" ref={canvasRef} aria-hidden="true" />
          <div className="shell">
            <header className="top">
              <SearchBar onSearch={(city) => setQuery({ type: "city", city })} onLocate={locate} />
              <UnitToggle units={units} onChange={changeUnits} />
            </header>

            {notice && <div className={"notice" + (notice.error ? " is-error" : "")} role="status">{notice.text}</div>}
            {!apiKey && <Setup onSave={saveKey} />}
            {apiKey && data && <Dashboard data={data} units={units} loading={loading} />}
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
